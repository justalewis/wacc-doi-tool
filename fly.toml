# Fly.io config for the demo deployment while the Windows install is arranged.
# The passphrase is a Fly secret, never in this file:  fly secrets set WACDOI_ACCESS_CODE=...
#
#   fly launch --no-deploy --copy-config
#   fly deploy
#
# Stateless, so there is no volume and nothing to back up.

app = "wacc-doi-tool"
primary_region = "sjc"

[build]

[env]
  CROSSREF_MAILTO = "jlewis2@olympic.edu"
  WACDOI_PREFIX = "10.37514"
  WACDOI_REGISTRANT = "WAC Clearinghouse"
  WACDOI_SECURE_COOKIES = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
