{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="lede">This tool is for Clearinghouse staff. Enter the shared passphrase.</p>
{% if error %}<div class="note bad" role="alert">{{ error }}</div>{% endif %}
<form method="post" class="narrow">
  <label>Passphrase<input type="password" name="code" autocomplete="current-password" autofocus required></label>
  <p class="actions"><button class="btn">Sign in</button></p>
</form>
{% endblock %}
